name: Purge assets/json cache after deploy

on:
  deployment_status

jobs:
  purge:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'production')
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    steps:
      - name: Find previous production deployment
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_ID: ${{ github.event.deployment.id }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          set -euo pipefail
          base_sha=$(gh api "repos/$REPO/deployments" -f environment="$ENVIRONMENT" -F per_page=10 \
            | jq -r --arg cur "$CURRENT_ID" 'map(select((.id|tostring) != $cur)) | sort_by(.created_at) | reverse | .[0].sha // empty')
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - name: Find changed files under /assets/json
        id: diff
        env:
          BASE_SHA: ${{ steps.prev.outputs.base_sha }}
        run: |
          base="${BASE_SHA:-HEAD~1}"
          git diff --name-only "$base" HEAD -- public/assets/json/ > changed.txt
          if [ -s changed.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for old deployment teardown
        if: steps.diff.outputs.changed == 'true'
        run: sleep 55

      - name: Purge changed files from Cloudflare
        if: steps.diff.outputs.changed == 'true'
        run: |
          urls=$(sed 's|^public/|https://jailbreakchangelogs.com/|' changed.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":$urls}"
